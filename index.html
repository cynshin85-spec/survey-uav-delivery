var ANS = {};
var startTime = Date.now();
var TOTAL = 0;
var KEY = "uav_delivery_survey_v1";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function store(){try{localStorage.setItem(KEY, JSON.stringify({ans:ANS,t:startTime}));}catch(e){}}
function restore(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.ans){ANS=d.ans;if(d.t)startTime=d.t;}}catch(e){}}

function render(){
  resetIdx();
  var app=document.getElementById("app");
  var html="";
  SURVEY.forEach(function(b,bi){
    if(b.type==="section"){html+='<div class="sec-title">'+esc(b.title)+'</div>';return;}
    if(b.type==="intro"||b.type==="intro2"){html+='<div class="card">'+b.html+'</div>';return;}
    html+='<div class="card"><div class="q" data-q="'+(b.id||("lk"+bi))+'">';
    if(b.type==="radio"||b.type==="multi"){
      html+='<div class="q-title"><span class="idx">'+nextIdx()+'、</span>'+esc(b.title)+(b.hint?'<span class="q-hint">（'+esc(b.hint)+'）</span>':'')+'<span class="req">*</span></div>';
      b.options.forEach(function(o,oi){
        var sel = b.type==="radio" ? ANS[b.id]===oi : (ANS[b.id]&&ANS[b.id].indexOf(oi)>=0);
        html+='<div class="opt'+(sel?' on':'')+'" data-id="'+b.id+'" data-oi="'+oi+'" data-type="'+b.type+'"><div class="'+(b.type==="radio"?"dot":"sq")+'"></div><div class="label">'+esc(o)+'</div></div>';
      });
    } else if(b.type==="likert"){
      html+='<div class="q-title"><span class="idx">'+nextIdx()+'、</span>'+esc(b.title)+(b.hint?'<span class="q-hint">（'+esc(b.hint)+'）</span>':'')+'<span class="req">*</span></div>';
      html+='<div class="likert-head"><div class="sp"></div><div class="scale"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>';
      b.items.forEach(function(it){
        html+='<div class="likert-item"><div class="text">'+esc(it[1])+'</div><div class="scale">';
        for(var v=1;v<=5;v++){
          html+='<label><input type="radio" name="lk_'+it[0]+'" value="'+v+'" data-id="'+it[0]+'" data-type="likert"'+(ANS[it[0]]===v?' checked':'')+'><i></i></label>';
        }
        html+='</div></div>';
      });
      html+='<div class="legend"><span>非常不同意</span><span>非常同意</span></div>';
    } else if(b.type==="sp"){
      html+='<div class="q-title"><span class="idx">'+nextIdx()+'、</span>'+esc(b.title)+'<span class="q-hint">（请选择更愿意接受的一种）</span><span class="req">*</span></div>';
      var uavSel = ANS[b.id]===0, rdSel = ANS[b.id]===1, opSel = ANS[b.id]===2;
      html+='<div class="sp-wrap">';
      html+='<div class="sp-card'+(uavSel?' on':'')+'" data-id="'+b.id+'" data-oi="0" data-type="sp"><div class="name">无人机配送</div><div class="attr">送达时间<br><b>'+esc(b.uav.t)+'</b><br>配送费<br><b>'+esc(b.uav.c)+'</b></div></div>';
      html+='<div class="sp-card'+(rdSel?' on':'')+'" data-id="'+b.id+'" data-oi="1" data-type="sp"><div class="name">骑手配送</div><div class="attr">送达时间<br><b>'+esc(b.rider.t)+'</b><br>配送费<br><b>'+esc(b.rider.c)+'</b></div></div>';
      html+='</div>';
      html+='<div class="sp-opt'+(opSel?' on':'')+'" data-id="'+b.id+'" data-oi="2" data-type="sp"><div class="dot"></div><span>这次不点外卖</span></div>';
    }
    html+='</div></div>';
  });
  app.innerHTML=html;
  bind();
  updateProgress();

var idxCounter=0;
function nextIdx(){idxCounter++;return idxCounter;}
function resetIdx(){idxCounter=0;}

function bind(){
  document.querySelectorAll(".opt").forEach(function(el){
    el.addEventListener("click",function(){
      var id=el.dataset.id, oi=parseInt(el.dataset.oi,10), tp=el.dataset.type;
      if(tp==="radio"){
        ANS[id]=oi;
        el.parentNode.querySelectorAll('.opt[data-id="'+id+'"]').forEach(function(x){x.classList.remove("on");});
        el.classList.add("on");
      } else {
        var arr=ANS[id]||[];
        var max=3;
        SURVEY.forEach(function(b){if(b.id===id&&b.max)max=b.max;});
        var pos=arr.indexOf(oi);
        if(pos>=0){arr.splice(pos,1);el.classList.remove("on");}
        else{
          if(arr.length>=max){toast("最多选择"+max+"项");return;}
          arr.push(oi);el.classList.add("on");
        }
        ANS[id]=arr;
      }
      store();updateProgress();
    });
  });
  document.querySelectorAll('input[type=radio][data-type=likert]').forEach(function(inp){
    inp.addEventListener("change",function(){ANS[inp.dataset.id]=parseInt(inp.value,10);store();updateProgress();});
  });
  document.querySelectorAll(".sp-card,.sp-opt").forEach(function(el){
    el.addEventListener("click",function(){
      var id=el.dataset.id, oi=parseInt(el.dataset.oi,10);
      ANS[id]=oi;
      document.querySelectorAll('[data-id="'+id+'"]').forEach(function(x){
        if(x.classList.contains("sp-card")||x.classList.contains("sp-opt"))x.classList.remove("on");
      });
      el.classList.add("on");
      store();updateProgress();
    });
  });
}

function countTotal(){
  var n=0;
  SURVEY.forEach(function(b){
    if(b.type==="radio"||b.type==="multi"||b.type==="sp")n+=1;
    if(b.type==="likert")n+=b.items.length;
  });
  return n;
}
function countDone(){
  var n=0;
  SURVEY.forEach(function(b){
    if(b.type==="radio"||b.type==="sp"){if(typeof ANS[b.id]==="number")n+=1;}
    else if(b.type==="multi"){if((ANS[b.id]||[]).length>0)n+=1;}
    else if(b.type==="likert"){b.items.forEach(function(it){if(typeof ANS[it[0]]==="number")n+=1;});}
  });
  return n;
}
function updateProgress(){
  var t=TOTAL||1,d=countDone();
  var p=Math.min(100,Math.round(d/t*100));
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("pnum").textContent=p+"%";
  return p;
}
function toast(m){
  var el=document.getElementById("toast");
  el.textContent=m;el.classList.add("show");
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove("show");},1600);
}

function collect(){
  var r={};
  r.resp_id="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  r.submit_time=new Date().toISOString();
  r.duration_sec=Math.round((Date.now()-startTime)/1000);
  ["q1","q3","q4","q17","q18","q20"].forEach(function(k){r[k]=typeof ANS[k]==="number"?ANS[k]+1:null;});
  var q2=["q2_speed","q2_fee","q2_discount","q2_food","q2_rep","q2_service","q2_other"];
  q2.forEach(function(k){r[k]=0;});
  (ANS.q2||[]).forEach(function(i){r[q2[i]]=1;});
  var q19=["q19_daily","q19_night","q19_campus","q19_holiday","q19_emergency","q19_none"];
  q19.forEach(function(k){r[k]=0;});
  (ANS.q19||[]).forEach(function(i){r[q19[i]]=1;});
  ["a1","a2","a3","r1","r2","r3","r4","e1","e2","t1","t2","s1","s2","i1","i2","p1","p2","in1","in2","in3"].forEach(function(k){r[k]=ANS[k]||null;});
  for(var i=1;i<=6;i++){r["c"+i]=(typeof ANS["c"+i]==="number")?ANS["c"+i]+1:null;}
  ["d1","d2","d3","d4","d5"].forEach(function(k){r[k]=typeof ANS[k]==="number"?ANS[k]+1:null;});
  r.d6=typeof ANS.d6==="number"?(ANS.d6===0?1:0):null;
  r.d7=typeof ANS.d7==="number"?(ANS.d7===0?1:0):null;
  r.d8=typeof ANS.d8==="number"?ANS.d8+1:null;
  return r;
}

function validate(){
  var bad=[];
  SURVEY.forEach(function(b){
    if(!b.id)return;
    var el=document.querySelector('.q[data-q="'+b.id+'"]');
    var ok=false;
    if(b.type==="radio"||b.type==="sp")ok=typeof ANS[b.id]==="number";
    else if(b.type==="multi")ok=(ANS[b.id]||[]).length>0;
    else if(b.type==="likert")ok=b.items.every(function(it){return typeof ANS[it[0]]==="number";});
    if(!ok&&el)bad.push(el);
    else if(b.type==="likert"){
      var miss=b.items.filter(function(it){return typeof ANS[it[0]]!=="number";});
      if(miss.length){var li=el.querySelector(".likert-item");if(li)bad.push(el);}
    }
  });
  if(bad.length){
    bad[0].classList.add("bad");
    bad[0].scrollIntoView({behavior:"smooth",block:"center"});
    toast("还有"+bad.length+"道题没有完成");
    setTimeout(function(){bad.forEach(function(e){e.classList.remove("bad");});},2500);
    return false;
  }
  return true;
}

async function sendData(rec){
  var body=JSON.stringify(rec);
  var ok=false;
  try{
    var r=await fetch(CFG.webhook,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:body});
    ok=true;
  }catch(e){}
  try{
    var r2=await fetch(CFG.ntfy+"/"+CFG.topic,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8","Title":"survey-response"},body:body});
    if(r2.ok)ok=true;
  }catch(e){}
  return ok;
}

async function submit(){
  if(!validate())return;
  var rec=collect();
  var btn=document.getElementById("submitBtn");
  btn.disabled=true;btn.textContent="正在提交…";
  var ok=await sendData(rec);
  btn.disabled=false;btn.textContent="提交问卷";
  if(ok){
    document.getElementById("app").innerHTML='<div class="success"><div class="icon">&#10003;</div><h2>提交成功</h2><p>感谢您的参与！您的回答已被记录。</p><p style="margin-top:10px;font-size:12.5px;color:#b3bac7">本页面不会收集您的姓名、手机号等个人信息</p></div>';
    document.getElementById("submitWrap").style.display="none";
    try{localStorage.removeItem(KEY);}catch(e){}
    document.getElementById("bar").style.width="100%";
    document.getElementById("pnum").textContent="100%";
    window.scrollTo({top:0,behavior:"smooth"});
  }else{
    toast("网络异常，请检查网络后重试");
    try{localStorage.setItem(KEY+"_pending",JSON.stringify(rec));}catch(e){}
  }
}

function init(){
  restore();
  document.getElementById("submitWrap").style.display="block";
  render();
  document.getElementById("submitBtn").addEventListener("click",submit);
  window.addEventListener("scroll",function(){
    var d=countDone(),t=TOTAL||1;
    setTimeout(function(){document.getElementById("bar").style.width=Math.min(100,Math.round(d/t*100))+"%";},0);
  });
}
TOTAL=countTotal();
init();
</script>
</body>
